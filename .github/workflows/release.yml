# Release one domain of the library.
# Actions -> release -> Run workflow -> pick domain + version.
#   core + 2.3.0  creates core/v2.3.0 and moves core/v2
#
# When you cut a new MAJOR of core, update the @core/vN refs inside the
# vue-* and c-* workflows in a separate PR and release those domains too.
name: release

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Which part of the library to release
        type: choice
        required: true
        options:
          - core
          - vue
          - c
      version:
        description: Version without the v (e.g. 1.3.0)
        required: true

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    permissions:
      contents: write
    env:
      DOMAIN: ${{ inputs.domain }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate
        id: validate
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3"; exit 1
          fi
          tag="$DOMAIN/v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists"; exit 1
          fi
          prev=$(git tag --list "$DOMAIN/v*.*.*" --sort=-v:refname | head -n1)
          if [ -n "$prev" ]; then
            newest=$(printf '%s\n%s\n' "${prev#"$DOMAIN"/v}" "$VERSION" | sort -V | tail -n1)
            if [ "$newest" != "$VERSION" ]; then
              echo "::error::$VERSION is not newer than $prev"; exit 1
            fi
          fi
          {
            echo "tag=$tag"
            echo "major=$DOMAIN/v${VERSION%%.*}"
            echo "prev=$prev"
          } >> "$GITHUB_OUTPUT"

      - name: Tag and move major
        env:
          TAG: ${{ steps.validate.outputs.tag }}
          MAJOR: ${{ steps.validate.outputs.major }}
        run: |
          git tag "$TAG"
          git tag -f "$MAJOR"
          git push origin "$TAG"
          git push -f origin "$MAJOR"

      # curl + jq rather than gh: the self-hosted runner doesn't have gh.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          TAG: ${{ steps.validate.outputs.tag }}
          PREV: ${{ steps.validate.outputs.prev }}
        run: |
          gh_api() {
            curl -fsS -X POST "$API/$1" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              --data-binary @-
          }
          notes=$(jq -n --arg tag "$TAG" --arg prev "$PREV" \
              '{tag_name: $tag} + if $prev == "" then {} else {previous_tag_name: $prev} end' \
            | gh_api releases/generate-notes | jq -r .body)
          jq -n --arg tag "$TAG" --arg name "$DOMAIN v$VERSION" --arg body "$notes" \
              '{tag_name: $tag, name: $name, body: $body}' \
            | gh_api releases | jq -r '"Released \(.html_url)"' >> "$GITHUB_STEP_SUMMARY"
