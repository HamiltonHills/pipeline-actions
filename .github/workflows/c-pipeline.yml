# Complete pipeline for a CMake-based C project:
#   build + test + sonar + package + sbom + trivy  ->  (on release) GitHub release
#                                                ->  (opt-in) Artifactory upload
#
# Two ways to release:
#   - pass `version` from a manual run: builds that version, then tags
#     v<version> on the built commit only if everything passed
#   - push a v* tag (or create one in the GitHub UI) with `release: true`
#
# Caller job must grant: contents: write (for releases), id-token: write,
#                        attestations: write
name: c-pipeline

on:
  workflow_call:
    inputs:
      package-name:
        description: Package name, used in the tarball name and the Artifactory path
        type: string
        required: true
      source-dir:
        description: Directory containing CMakeLists.txt
        type: string
        default: '.'
      build-type:
        description: CMAKE_BUILD_TYPE
        type: string
        default: Release
      cmake-args:
        description: Extra space-separated arguments for the configure step
        type: string
        default: ''
      apt-packages:
        description: Space-separated apt packages to install first (e.g. libssl-dev)
        type: string
        default: ''
      trivy-severity:
        description: Comma-separated severities that count as findings
        type: string
        default: CRITICAL,HIGH
      sonar-args:
        description: Extra Sonar scanner arguments
        type: string
        default: ''
      release:
        description: Publish a GitHub release. Only valid when triggered by a v* tag
        type: boolean
        default: false
      version:
        description: >
          Release this version (e.g. 1.4.0) from a manual run on the default
          branch: build and scan it, then tag v<version> on the built commit and
          publish the release. Empty for normal CI
        type: string
        default: ''
      release-environment:
        description: Environment gating the release job (created automatically if missing)
        type: string
        default: release
      attest:
        description: Requires a public repo or GitHub Enterprise Cloud
        type: boolean
        default: false
      artifactory-publish:
        description: Upload the package, its checksum and SBOM to Artifactory. Needs artifactory-url, artifactory-repository and the ARTIFACTORY_TOKEN secret
        type: boolean
        default: false
      artifactory-url:
        description: Artifactory base URL, e.g. https://artifactory.example.com/artifactory
        type: string
        default: ''
      artifactory-repository:
        description: Target repository key, e.g. c-releases-local
        type: string
        default: ''
      artifactory-path:
        description: Directory inside the repository. Defaults to <package-name>/<version>
        type: string
        default: ''
      runs-on:
        description: Runner label for the build and release jobs. Use ubuntu-latest for GitHub-hosted
        type: string
        default: self-hosted
      artifactory-runs-on:
        description: >
          Runner label for the Artifactory upload job, e.g. a self-hosted runner
          that can reach your Artifactory. Defaults to runs-on
        type: string
        default: ''
      container:
        description: >
          Image to run every job in, e.g. ghcr.io/hamiltonhills/c-builder:1.
          The runner then only needs Docker. Empty runs directly on the runner
        type: string
        default: ''
    secrets:
      SONAR_TOKEN:
        description: Sonar token. Sonar is skipped with a notice when empty
        required: false
      SONAR_HOST_URL:
        description: SonarQube Server URL. Leave empty for SonarQube Cloud
        required: false
      ARTIFACTORY_TOKEN:
        description: Artifactory access token, required when artifactory-publish is true
        required: false

permissions:
  contents: read

# Inside a `container`, run steps default to sh, not bash. The steps below
# use bash syntax ([[ ]], ${VAR::7}, arrays).
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Steps run as root but the checkout belongs to the runner's user, so git
      # refuses it ("dubious ownership") and Sonar loses blame and new-code data.
      - name: Trust the checkout
        if: inputs.container != ''
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Runs before the build so a bad version input fails in seconds.
      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag=""
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
            tag="v$version"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::version must look like 1.2.3 or 1.2.3-rc.1 (got '$version')"; exit 1
            fi
            if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
              echo "::error::Release from $DEFAULT_BRANCH (got $GITHUB_REF)"; exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag already exists"; exit 1
            fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
          else
            version="0.0.0-${GITHUB_SHA::7}"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Build and test
        id: build
        uses: HamiltonHills/pipeline-actions/c/build@c/v2
        with:
          source-dir: ${{ inputs.source-dir }}
          build-type: ${{ inputs.build-type }}
          cmake-args: ${{ inputs.cmake-args }}
          apt-packages: ${{ inputs.apt-packages }}

      - uses: HamiltonHills/pipeline-actions/core/sonar-scan@core/v2
        with:
          token: ${{ secrets.SONAR_TOKEN }}
          host-url: ${{ secrets.SONAR_HOST_URL }}
          project-base-dir: ${{ inputs.source-dir }}
          args: -Dsonar.cfamily.compile-commands=${{ steps.build.outputs.compile-commands }} ${{ inputs.sonar-args }}

      - name: Source scan (vulnerable manifests, committed secrets)
        uses: HamiltonHills/pipeline-actions/core/trivy-scan@core/v2
        with:
          scan-type: fs
          target: ${{ inputs.source-dir }}
          severity: ${{ inputs.trivy-severity }}

      - name: Package
        id: package
        uses: HamiltonHills/pipeline-actions/c/package@c/v2
        with:
          build-dir: ${{ steps.build.outputs.build-dir }}
          name: ${{ inputs.package-name }}
          version: ${{ steps.version.outputs.version }}

      - name: SBOM
        id: sbom
        uses: HamiltonHills/pipeline-actions/core/sbom@core/v2
        with:
          path: ${{ steps.package.outputs.staging-dir }}
          output-file: dist/${{ inputs.package-name }}-${{ steps.version.outputs.version }}.cdx.json

      - name: SBOM scan
        uses: HamiltonHills/pipeline-actions/core/trivy-scan@core/v2
        with:
          scan-type: sbom
          target: ${{ steps.sbom.outputs.path }}
          severity: ${{ inputs.trivy-severity }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c-package
          path: dist/
          if-no-files-found: error

      - name: Hand files back to the runner user
        if: always() && inputs.container != ''
        run: |
          # Container jobs run as root, and the workspace, temp dir and tool
          # cache are bind mounts from the self-hosted runner. Root-owned
          # files there break the next job that runs on the host.
          [[ $(id -u) == 0 ]] || exit 0
          owner=$(stat -c '%u:%g' "$GITHUB_WORKSPACE/..")
          chown -R "$owner" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$RUNNER_TOOL_CACHE" || true

  release:
    needs: build
    if: inputs.release || inputs.version != ''
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container }}
    environment: ${{ inputs.release-environment }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Require a version tag
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::release=true is only valid for v* tag pushes or with version set (got $GITHUB_REF)"
            exit 1
          fi

      # No checkout here to clean the workspace, and a self-hosted runner keeps
      # the last job's dist/. download-artifact adds to it, so dist/* would
      # pick up another run's package.
      - name: Start from an empty dist
        run: rm -rf dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: c-package
          path: dist

      - name: Attest build provenance
        if: inputs.attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Attest SBOM
        if: inputs.attest
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/${{ inputs.package-name }}-${{ needs.build.outputs.version }}.cdx.json

      # With `version`, this also creates the tag, on the commit that was built.
      # A release made in the GitHub UI already exists, so attach to it.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
            echo "::notice::Release $TAG already existed; attached the package to it"
          else
            gh release create "$TAG" dist/* \
              --repo "$REPO" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Hand files back to the runner user
        if: always() && inputs.container != ''
        run: |
          # Container jobs run as root, and the workspace, temp dir and tool
          # cache are bind mounts from the self-hosted runner. Root-owned
          # files there break the next job that runs on the host.
          [[ $(id -u) == 0 ]] || exit 0
          owner=$(stat -c '%u:%g' "$GITHUB_WORKSPACE/..")
          chown -R "$owner" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$RUNNER_TOOL_CACHE" || true

  artifactory:
    needs: build
    if: inputs.artifactory-publish
    runs-on: ${{ inputs.artifactory-runs-on || inputs.runs-on }}
    container: ${{ inputs.container }}
    permissions:
      contents: read
    steps:
      - name: Check Artifactory settings
        env:
          URL: ${{ inputs.artifactory-url }}
          REPO: ${{ inputs.artifactory-repository }}
          HAS_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN != '' }}
        run: |
          missing=()
          [ -n "$URL" ] || missing+=(artifactory-url)
          [ -n "$REPO" ] || missing+=(artifactory-repository)
          [ "$HAS_TOKEN" = true ] || missing+=("secret ARTIFACTORY_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::artifactory-publish is true but these are missing: ${missing[*]}"
            exit 1
          fi

      # No checkout here to clean the workspace, and a self-hosted runner keeps
      # the last job's dist/. download-artifact adds to it, so dist/* would
      # pick up another run's package.
      - name: Start from an empty dist
        run: rm -rf dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: c-package
          path: dist

      - uses: HamiltonHills/pipeline-actions/core/artifactory-upload@core/v2
        with:
          url: ${{ inputs.artifactory-url }}
          repository: ${{ inputs.artifactory-repository }}
          path: ${{ inputs.artifactory-path || format('{0}/{1}', inputs.package-name, needs.build.outputs.version) }}
          token: ${{ secrets.ARTIFACTORY_TOKEN }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.cdx.json
          properties: vcs.url=${{ github.server_url }}/${{ github.repository }};vcs.revision=${{ github.sha }};vcs.ref=${{ needs.build.outputs.tag && format('refs/tags/{0}', needs.build.outputs.tag) || github.ref }};version=${{ needs.build.outputs.version }};ci.run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Hand files back to the runner user
        if: always() && inputs.container != ''
        run: |
          # Container jobs run as root, and the workspace, temp dir and tool
          # cache are bind mounts from the self-hosted runner. Root-owned
          # files there break the next job that runs on the host.
          [[ $(id -u) == 0 ]] || exit 0
          owner=$(stat -c '%u:%g' "$GITHUB_WORKSPACE/..")
          chown -R "$owner" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$RUNNER_TOOL_CACHE" || true
