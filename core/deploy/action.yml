name: Deploy
description: >
  Optionally verify an image's build provenance, then run the caller's own
  deploy script. The script receives DEPLOY_ENVIRONMENT and IMAGE as env vars,
  so each team keeps control of *how* they deploy (kubectl, helm, ssh, ...)
  while the library standardizes the gate in front of it.
inputs:
  environment:
    description: Target environment name, passed to the script as DEPLOY_ENVIRONMENT
    required: true
  script:
    description: Path (in the caller's repo) to an executable deploy script
    required: true
  image:
    description: Image reference pinned by digest (name@sha256:...). Empty for non-container deploys
    default: ''
  verify-attestation:
    description: Verify the image's build provenance with gh attestation verify before deploying
    default: 'false'
  github-token:
    description: Token for attestation verification
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Verify build provenance
      if: inputs.verify-attestation == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        IMAGE: ${{ inputs.image }}
        OWNER: ${{ github.repository_owner }}
      run: |
        if [[ "$IMAGE" != *@sha256:* ]]; then
          echo "::error::verify-attestation requires an image pinned by digest (name@sha256:...)"
          exit 1
        fi
        gh attestation verify "oci://$IMAGE" --owner "$OWNER"

    - name: Run deploy script
      shell: bash
      env:
        SCRIPT: ${{ inputs.script }}
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        IMAGE: ${{ inputs.image }}
      run: |
        if [ ! -f "$SCRIPT" ]; then
          echo "::error::Deploy script not found: $SCRIPT"; exit 1
        fi
        echo "Deploying ${IMAGE:-artifact} to $DEPLOY_ENVIRONMENT"
        bash "$SCRIPT"
