# Python tooling for this repo. Only used to build the docs site:
#   uv run mkdocs serve
[project]
name = "pipeline-actions-docs"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    # MkDocs 2.0 drops the plugin/theme system Material depends on.
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7",
]

[tool.uv]
package = false
